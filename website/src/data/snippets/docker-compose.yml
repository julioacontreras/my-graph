services:
  mygraph:
    image: julioacontreras/mygraph:latest   # or ghcr.io/julioacontreras/mygraph:latest
    ports:
      - "6660:6660"        # change the left side to use another host port
    volumes:
      - mygraph-data:/data
    init: true
    restart: unless-stopped

volumes:
  mygraph-data:
