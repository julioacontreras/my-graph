[workspace]
resolver = "2"
members = [
    "crates/mygraph-core",
    "crates/mygraph-cypher",
    "crates/mygraph-storage",
    "crates/mygraph",
    "crates/mygraph-cli",
    "crates/mygraph-protocol",
    "crates/mygraph-server",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace.dependencies]
mygraph-core = { path = "crates/mygraph-core" }
mygraph-cypher = { path = "crates/mygraph-cypher" }
mygraph-storage = { path = "crates/mygraph-storage" }
mygraph = { path = "crates/mygraph" }
mygraph-protocol = { path = "crates/mygraph-protocol" }
thiserror = "2"
crc32fast = "1"
tempfile = "3"
